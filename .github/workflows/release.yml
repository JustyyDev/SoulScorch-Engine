name: Release Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_name: SoulScorch-Windows
            archive_name: SoulScorch-Windows.zip
          - os: ubuntu-latest
            target: linux
            artifact_name: SoulScorch-Linux
            archive_name: SoulScorch-Linux.zip
          - os: macos-14
            target: mac
            artifact_name: SoulScorch-macOS
            archive_name: SoulScorch-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
          cache-dependency-path: project.xml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Native Linux Libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib g++-multilib \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Cache hxcpp Compiler Data (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:/Users/runneradmin/.hxcpp
          key: ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-${{ hashFiles('project.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-

      - name: Cache Haxelib Repository (Windows)
        if: matrix.os == 'windows-latest'
        id: cache-haxelib-windows
        uses: actions/cache@v4
        with:
          path: C:/Users/runneradmin/haxelib
          key: ${{ runner.os }}-${{ runner.arch }}-haxelib-${{ hashFiles('project.xml', '.github/workflows/release.yml', '.github/workflows/mobile.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-haxelib-

      - name: Cache hxcpp Compiler Data (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ~/.cache/hxcpp
          key: ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-${{ hashFiles('project.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-

      - name: Cache Haxelib Repository (Unix)
        if: matrix.os != 'windows-latest'
        id: cache-haxelib-unix
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-${{ runner.arch }}-haxelib-${{ hashFiles('project.xml', '.github/workflows/release.yml', '.github/workflows/mobile.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-haxelib-

      - name: Install Haxelib Dependencies (Windows)
        if: matrix.os == 'windows-latest' && steps.cache-haxelib-windows.outputs.cache-hit != 'true'
        run: |
          haxelib install lime 8.1.3 --quiet --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --skip-dependencies
          haxelib install hscript 2.4.0 --quiet
          haxelib set hscript 2.4.0
          haxelib install hscript-iris 1.1.0 --quiet
          haxelib install away3d --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc
          haxelib git linc_luajit https://github.com/JustyyDev/linc_luajit.git

      - name: Ensure HScript Version (Windows)
        if: matrix.os == 'windows-latest'
        run: haxelib set hscript 2.4.0

      - name: Install Haxelib Dependencies (Unix)
        if: matrix.os != 'windows-latest' && steps.cache-haxelib-unix.outputs.cache-hit != 'true'
        run: |
          haxelib install lime 8.1.3 --quiet --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --skip-dependencies
          haxelib install hscript 2.4.0 --quiet
          haxelib set hscript 2.4.0
          haxelib install hscript-iris 1.1.0 --quiet
          haxelib install away3d --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc
          haxelib git linc_luajit https://github.com/JustyyDev/linc_luajit.git

      - name: Ensure HScript Version (Unix)
        if: matrix.os != 'windows-latest'
        run: haxelib set hscript 2.4.0

      - name: Patch Lime GPU Hint Export Syntax
        run: |
          python -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "lime"], capture_output=True, text=True)
          lines = [line.strip() for line in res.stdout.splitlines() if line.strip()]
          lime_path = ""
          for line in reversed(lines):
            if os.path.isdir(line):
              lime_path = line
              break

          if not lime_path:
            raise SystemExit("Could not resolve lime libpath from haxelib output")

          candidates = [
            os.path.join(lime_path, "lime", "system", "System.hx"),
            os.path.join(lime_path, "src", "lime", "system", "System.hx")
          ]
          system_hx = next((p for p in candidates if os.path.exists(p)), "")
          if not system_hx:
            raise SystemExit("Could not find Lime System.hx. Checked: " + " | ".join(candidates))
          with open(system_hx, "r", encoding="utf-8") as f:
              content = f.read()
          patched = content.replace("_declspec(dllexport)", "__declspec(dllexport)")
          if patched != content:
              with open(system_hx, "w", encoding="utf-8") as f:
                  f.write(patched)
              print("Patched Lime System.hx:", system_hx)
          else:
              print("No Lime export patch needed:", system_hx)
          '

      - name: Rebuild Host Lime NDLL (macOS Fix)
        if: matrix.os == 'macos-14'
        run: |
          resolve_lime_path() {
            haxelib libpath lime | awk 'NF{last=$0} END{print last}'
          }

          resolve_ndll_dir() {
            local lp="$1"
            if [ "$(uname -m)" = "arm64" ] && [ -f "$lp/ndll/MacArm64/lime.ndll" ]; then
              echo "$lp/ndll/MacArm64"
              return 0
            fi
            if [ -f "$lp/ndll/Mac64/lime.ndll" ]; then
              echo "$lp/ndll/Mac64"
              return 0
            fi
            local found
            found="$(find "$lp/ndll" -name lime.ndll -print 2>/dev/null | head -n 1)"
            if [ -n "$found" ]; then
              dirname "$found"
              return 0
            fi
            return 1
          }

          LIME_PATH="$(resolve_lime_path)"
          if [ -z "$LIME_PATH" ] || [ ! -d "$LIME_PATH" ]; then
            echo "Error: Could not resolve Lime library path."
            exit 1
          fi

          if ! LIME_NDLL_PATH="$(resolve_ndll_dir "$LIME_PATH")"; then
            echo "Host lime.ndll missing. Reinstalling lime and rebuilding host NDLL..."
            haxelib install lime 8.1.3 --quiet --skip-dependencies || true
            haxelib run lime rebuild mac -release || true
            LIME_PATH="$(resolve_lime_path)"
          fi

          if ! LIME_NDLL_PATH="$(resolve_ndll_dir "$LIME_PATH")"; then
            echo "Error: lime.ndll is still missing after recovery attempts."
            exit 1
          fi

          export NEKOPATH="$LIME_NDLL_PATH:${NEKOPATH:-}"
          export DYLD_FALLBACK_LIBRARY_PATH="$LIME_NDLL_PATH:${DYLD_FALLBACK_LIBRARY_PATH:-}"
          echo "NEKOPATH=$NEKOPATH" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$DYLD_FALLBACK_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "Configured host NDLL path: $LIME_NDLL_PATH"

          NEKO_BIN="$(command -v neko || true)"
          if [ -n "$NEKO_BIN" ]; then
            NEKO_DIR="$(dirname "$NEKO_BIN")"
            cp -f "$LIME_NDLL_PATH/lime.ndll" "$NEKO_DIR/lime.ndll" || true
          fi

          haxelib run lime config MAC_USE_CURRENT_SDK 1

      - name: Patch Flixel ConsoleUtil for Haxe 4.3+
        run: |
          python -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "flixel"], capture_output=True, text=True)
          flixel_path = res.stdout.strip().splitlines()[-1]
          console_util = os.path.join(flixel_path, "flixel", "system", "debug", "console", "ConsoleUtil.hx")
          if os.path.exists(console_util):
              with open(console_util, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("return interp.expr(", "return @:privateAccess interp.expr(")
              with open(console_util, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched:", console_util)
          '

      - name: Compile SoulScorch Engine
        run: haxelib run lime build ${{ matrix.target }} -release -DHXCPP_NO_PCH -DHXCPP_STRIP_SYMBOLS -DHXCPP_GC_GENERATIONAL -DHXCPP_GC_BIG_BLOCKS
        env:
          HXCPP_COMPILE_THREADS: 8

      - name: Package Executable Archive (Universal Python Packager)
        run: |
          python -c '
          import os, sys, zipfile

          target = "${{ matrix.target }}".lower()
          archive_name = "${{ matrix.archive_name }}"
          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          output_zip = os.path.join(workspace, archive_name)

          search_roots = ["bin", "export"]
          found_dir = None

          candidates = []
          for s_root in search_roots:
              if not os.path.exists(s_root):
                  continue
              for root, dirs, files in os.walk(s_root):
                  if "obj" in root or "haxe" in root:
                      continue
                  if target == "windows" and any(f.endswith(".exe") for f in files):
                      candidates.append(root)
                  elif target == "mac" and (any(d.endswith(".app") for d in dirs) or any(f.endswith(".app") for f in files) or "mac" in root.lower()):
                      candidates.append(root)
                  elif target == "linux" and any(f == "SoulScorch" and os.access(os.path.join(root, f), os.X_OK) for f in files):
                      candidates.append(root)

          for c in candidates:
              if target in c.lower() or (target == "mac" and "macos" in c.lower()):
                  found_dir = c
                  break

          if not found_dir and candidates:
              found_dir = candidates[0]

          if not found_dir:
              for s_root in search_roots:
                  if not os.path.exists(s_root): continue
                  for root, dirs, files in os.walk(s_root):
                      if os.path.basename(root) == "bin" and "obj" not in root and "haxe" not in root:
                          found_dir = root
                          break

          if not found_dir:
              print("Error: Could not locate build directory. Workspace contents:")
              for r, d, f in os.walk("."):
                  if not r.startswith("./.git"):
                      print(r, d, f)
              sys.exit(1)

          print(f"Packaging build from: {found_dir} -> {output_zip}")
          with zipfile.ZipFile(output_zip, "w", zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk(found_dir):
                  for file in files:
                      file_path = os.path.join(root, file)
                      arcname = os.path.relpath(file_path, found_dir)
                      zipf.write(file_path, arcname)

          print(f"Archive successfully created: {output_zip} ({os.path.getsize(output_zip)} bytes)")
          '

      - name: Upload Packaged Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error