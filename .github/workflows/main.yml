name: Build Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_path: bin/windows/bin
            cache_path: C:\hxcpp_cache
          - os: ubuntu-latest
            target: linux
            artifact_path: bin/linux/bin
            cache_path: ~/.hxcpp_cache
          - os: macos-latest
            target: mac
            artifact_path: bin/mac/bin
            cache_path: ~/.hxcpp_cache
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.4

      - name: Cache HXCPP Build Artifacts
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_path }}
          key: hxcpp-cache-${{ matrix.target }}-${{ hashFiles('**/Project.xml', '**/haxelib.json') }}
          restore-keys: |
            hxcpp-cache-${{ matrix.target }}-

      - name: Setup Haxelib (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          haxelib setup C:/haxelib
          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.5.0 --quiet
          haxelib install flixel-addons 3.2.3 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install hxdiscord_rpc --quiet
          haxelib run lime setup -y

      - name: Setup Haxelib (Unix / Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.5.0 --quiet
          haxelib install flixel-addons 3.2.3 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install hxdiscord_rpc --quiet
          haxelib run lime setup -y

      - name: Apply macOS hxcpp SDK Fix
        if: matrix.os == 'macos-latest'
        run: |
          haxelib git hxcpp https://github.com/joshtynjala/hxcpp.git fix/mac-dot-zero-sdk

      - name: Build Engine (Fast Parallel Compile)
        run: haxelib run lime build ${{ matrix.target }} -release
        env:
          HXCPP_COMPILE_THREADS: 8