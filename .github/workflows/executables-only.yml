name: Executables Only (Raw Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_name: SoulScorch-Windows-Binaries
            output_path: bin/windows/bin
          - os: ubuntu-latest
            target: linux
            artifact_name: SoulScorch-Linux-Binaries
            output_path: bin/linux/bin
          - os: macos-14
            target: mac
            artifact_name: SoulScorch-Mac-Binaries
            output_path: bin/mac/bin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.4

      - name: Setup Haxelib (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          haxelib setup C:/haxelib
          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.5.0 --quiet
          haxelib install flixel-addons 3.2.3 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install hxdiscord_rpc --quiet
          haxelib run lime setup -y

      - name: Setup Haxelib (Unix / Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.5.0 --quiet
          haxelib install flixel-addons 3.2.3 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install hxdiscord_rpc --quiet
          haxelib run lime setup -y

      - name: Build Engine
        run: haxelib run lime build ${{ matrix.target }} -release
        env:
          HXCPP_COMPILE_THREADS: 8

      - name: Upload Raw Executable Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}