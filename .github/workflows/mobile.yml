name: Mobile Builds (Android & iOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SOULSCORCH_EXTRA_DEFS: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;21.4.7075529" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"

      - name: Export Android NDK Environment Variables
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
          cache-dependency-path: project.xml

      - name: Cache hxcpp Compiler Data
        uses: actions/cache@v4
        with:
          path: ~/.cache/hxcpp
          key: ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-android-${{ hashFiles('project.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-android-

      - name: Cache Haxelib Repository
        id: cache-haxelib-android
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-${{ runner.arch }}-haxelib-android-${{ hashFiles('project.xml', '.github/workflows/release.yml', '.github/workflows/mobile.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-haxelib-android-
            ${{ runner.os }}-${{ runner.arch }}-haxelib-

      - name: Install Haxelib Dependencies
        if: steps.cache-haxelib-android.outputs.cache-hit != 'true'
        run: |
          haxelib install lime 8.1.3 --quiet --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --skip-dependencies
          haxelib install hscript 2.4.0 --quiet
          haxelib set hscript 2.4.0
          haxelib install hscript-iris 1.1.0 --quiet
          haxelib install away3d --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib git linc_luajit https://github.com/JustyyDev/linc_luajit.git

      - name: Ensure HScript Version
        run: haxelib set hscript 2.4.0

      - name: Patch Lime GPU Hint Export Syntax
        run: |
          python3 -c '
          import subprocess, os, re
          res = subprocess.run(["haxelib", "libpath", "lime"], capture_output=True, text=True)
          lines = [line.strip() for line in res.stdout.splitlines() if line.strip()]
          lime_path = ""
          for line in reversed(lines):
            if os.path.isdir(line):
              lime_path = line
              break

          if not lime_path:
            raise SystemExit("Could not resolve lime libpath from haxelib output")

          candidates = [
            os.path.join(lime_path, "lime", "system", "System.hx"),
            os.path.join(lime_path, "src", "lime", "system", "System.hx")
          ]
          system_hx = next((p for p in candidates if os.path.exists(p)), "")
          if not system_hx:
            raise SystemExit("Could not find Lime System.hx. Checked: " + " | ".join(candidates))
          with open(system_hx, "r", encoding="utf-8") as f:
              content = f.read()

          patched = content
          patched = patched.replace("_declspec(dllexport)", "__declspec(dllexport)")
          patched = patched.replace("___declspec(dllexport)", "__declspec(dllexport)")
          patched = re.sub(r"\b_+declspec\(dllexport\)", "__declspec(dllexport)", patched)

          if re.search(r"(?<!_)_declspec\(dllexport\)|_{3,}declspec\(dllexport\)", patched):
            raise SystemExit("Lime System.hx still contains malformed declspec tokens after patch")

          if patched != content:
              with open(system_hx, "w", encoding="utf-8") as f:
                  f.write(patched)
              print("Patched Lime System.hx:", system_hx)
          else:
              print("No Lime export patch needed:", system_hx)
          '

      - name: Patch Flixel ConsoleUtil for Haxe 4.3+
        run: |
          python3 -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "flixel"], capture_output=True, text=True)
          flixel_path = res.stdout.strip().splitlines()[-1]
          console_util = os.path.join(flixel_path, "flixel", "system", "debug", "console", "ConsoleUtil.hx")
          if os.path.exists(console_util):
              with open(console_util, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("return interp.expr(", "return @:privateAccess interp.expr(")
              with open(console_util, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched ConsoleUtil:", console_util)
          '

      - name: Configure Android Lime SDK Paths
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk/21.4.7075529
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Build Android Release APK
        run: haxelib run lime build android -release -DNO_PRELOAD_ALL -DSOULSCORCH_LUA -DHXCPP_STRIP_SYMBOLS -DHXCPP_GC_GENERATIONAL -DHXCPP_GC_BIG_BLOCKS ${{ env.SOULSCORCH_EXTRA_DEFS }}
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_ROOT: ${{ env.NDK_ROOT }}
          HXCPP_COMPILE_THREADS: 4

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulScorch-Android-Release-APK
          path: |
            bin/android/**/*.apk
            export/android/**/*.apk
            export/release/android/**/*.apk
            export/**/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Xcode Project
    runs-on: macos-15-intel
    timeout-minutes: 60

    env:
      SOULSCORCH_EXTRA_DEFS: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
          cache-dependency-path: project.xml

      - name: Cache hxcpp Compiler Data
        uses: actions/cache@v4
        with:
          path: ~/.cache/hxcpp
          key: ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-ios-${{ hashFiles('project.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-ios-

      - name: Cache Haxelib Repository
        id: cache-haxelib-ios
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-${{ runner.arch }}-haxelib-ios-${{ hashFiles('project.xml', '.github/workflows/release.yml', '.github/workflows/mobile.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-haxelib-ios-
            ${{ runner.os }}-${{ runner.arch }}-haxelib-

      - name: Install Haxelib Dependencies
        if: steps.cache-haxelib-ios.outputs.cache-hit != 'true'
        run: |
          haxelib install lime 8.1.3 --quiet --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --skip-dependencies
          haxelib install hscript 2.4.0 --quiet
          haxelib set hscript 2.4.0
          haxelib install hscript-iris 1.1.0 --quiet
          haxelib install away3d --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib git linc_luajit https://github.com/JustyyDev/linc_luajit.git

      - name: Ensure HScript Version
        run: haxelib set hscript 2.4.0

      - name: Patch Lime GPU Hint Export Syntax
        run: |
          python3 -c '
          import subprocess, os, re
          res = subprocess.run(["haxelib", "libpath", "lime"], capture_output=True, text=True)
          lines = [line.strip() for line in res.stdout.splitlines() if line.strip()]
          lime_path = ""
          for line in reversed(lines):
            if os.path.isdir(line):
              lime_path = line
              break

          if not lime_path:
            raise SystemExit("Could not resolve lime libpath from haxelib output")

          candidates = [
            os.path.join(lime_path, "lime", "system", "System.hx"),
            os.path.join(lime_path, "src", "lime", "system", "System.hx")
          ]
          system_hx = next((p for p in candidates if os.path.exists(p)), "")
          if not system_hx:
            raise SystemExit("Could not find Lime System.hx. Checked: " + " | ".join(candidates))
          with open(system_hx, "r", encoding="utf-8") as f:
              content = f.read()

          patched = content
          patched = patched.replace("_declspec(dllexport)", "__declspec(dllexport)")
          patched = patched.replace("___declspec(dllexport)", "__declspec(dllexport)")
          patched = re.sub(r"\b_+declspec\(dllexport\)", "__declspec(dllexport)", patched)

          if re.search(r"(?<!_)_declspec\(dllexport\)|_{3,}declspec\(dllexport\)", patched):
            raise SystemExit("Lime System.hx still contains malformed declspec tokens after patch")

          if patched != content:
              with open(system_hx, "w", encoding="utf-8") as f:
                  f.write(patched)
              print("Patched Lime System.hx:", system_hx)
          else:
              print("No Lime export patch needed:", system_hx)
          '

      - name: Verify Host Lime NDLL (Intel macOS)
        run: |
          haxelib run lime setup -y || true
          LIME_PATH="$(haxelib libpath lime | awk 'NF{last=$0} END{print last}')"
          LIME_NDLL_PATH="$LIME_PATH/ndll/Mac64"
          LIME_NDLL_FILE="$LIME_NDLL_PATH/lime.ndll"
          test -f "$LIME_NDLL_FILE"
          file "$LIME_NDLL_FILE"
          file "$LIME_NDLL_FILE" | grep -Eq 'x86_64|x86-64'
          echo "Verified Intel Lime host binary: $LIME_NDLL_FILE"

      - name: Patch hxcpp zlib for Apple SDK
        run: |
          python3 -c '
          import os, subprocess
          raw = subprocess.run(["haxelib", "libpath", "hxcpp"], capture_output=True, text=True).stdout
          roots = [line.strip() for line in raw.splitlines() if os.path.isdir(line.strip())]
          header = ""
          for root in reversed(roots):
              candidate = os.path.join(root, "project", "thirdparty", "zlib-1.2.11", "zutil.h")
              if os.path.exists(candidate):
                  header = candidate
                  break
          if not header:
              raise SystemExit("Could not locate hxcpp zlib zutil.h")
          with open(header, "r", encoding="utf-8") as f:
              content = f.read()
          old = "#        define fdopen(fd,mode) NULL /* No fdopen() */"
          new = "#        undef fdopen /* fdopen is provided by Apple libc */"
          if old in content:
              content = content.replace(old, new)
              with open(header, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched hxcpp zlib:", header)
          else:
              print("hxcpp zlib already patched or uses a different guard:", header)
          '

      - name: Patch Flixel ConsoleUtil for Haxe 4.3+
        run: |
          python3 -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "flixel"], capture_output=True, text=True)
          flixel_path = res.stdout.strip().splitlines()[-1]
          console_util = os.path.join(flixel_path, "flixel", "system", "debug", "console", "ConsoleUtil.hx")
          if os.path.exists(console_util):
              with open(console_util, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("return interp.expr(", "return @:privateAccess interp.expr(")
              with open(console_util, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched ConsoleUtil:", console_util)
          '

      - name: Generate iOS C++ & Xcode Project
        run: haxelib run lime build ios -release -nosign -DNO_PRELOAD_ALL -DSOULSCORCH_LUA -DHXCPP_STRIP_SYMBOLS -DHXCPP_GC_GENERATIONAL -DHXCPP_GC_BIG_BLOCKS -DNO_SIGNING -DCODE_SIGNING_ALLOWED=NO -DCODE_SIGNING_REQUIRED=NO ${{ env.SOULSCORCH_EXTRA_DEFS }}
        env:
          HXCPP_COMPILE_THREADS: 8
          HXCPP_CXXFLAGS: -Wno-unused-command-line-argument
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          DEVELOPMENT_TEAM: ""

      - name: Locate Xcode Project Output
        id: stage_xcode
        run: |
          python3 -c '
          import os, sys, shutil

          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          staging_dir = os.path.join(workspace, "dist", "SoulScorch-iOS-XcodeProject")

          found_dir = None
          for search_root in ("export", "bin"):
            if not os.path.isdir(search_root):
              continue
            for root, dirs, files in os.walk(search_root):
              if "obj" in root or "haxe" in root or "ios" not in root.lower():
                continue
              if any(d.endswith(".xcodeproj") for d in dirs):
                found_dir = root
                break
            if found_dir:
              break
          if not found_dir:
              print("Error: Could not locate Xcode project directory.")
              sys.exit(1)

          print(f"Staging iOS build from: {found_dir} -> {staging_dir}")
          if os.path.exists(staging_dir):
              shutil.rmtree(staging_dir)
          os.makedirs(staging_dir, exist_ok=True)

          for item in os.listdir(found_dir):
              s = os.path.join(found_dir, item)
              d = os.path.join(staging_dir, item)
              if os.path.isdir(s):
                  shutil.copytree(s, d, dirs_exist_ok=True)
              else:
                  shutil.copy2(s, d)

          print("Successfully staged iOS project:", staging_dir)
          '

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulScorch-iOS-XcodeProject
          path: dist/SoulScorch-iOS-XcodeProject
          if-no-files-found: error