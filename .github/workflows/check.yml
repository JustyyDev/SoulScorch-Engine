name: Fast Engine Check

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  haxe-compile-check:
    name: Haxe Compile Check
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
          cache-dependency-path: project.xml

      - name: Cache Haxelib Repository
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          path: C:/Users/runneradmin/haxelib
          key: ${{ runner.os }}-${{ runner.arch }}-haxelib-check-${{ hashFiles('project.xml', '.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-haxelib-check-
            ${{ runner.os }}-${{ runner.arch }}-haxelib-

      - name: Install Haxelib Dependencies
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          haxelib install lime 8.1.3 --quiet --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --skip-dependencies
          haxelib install hscript 2.4.0 --quiet
          haxelib set hscript 2.4.0
          haxelib install hscript-iris 1.1.0 --quiet
          haxelib install away3d --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc
          haxelib git linc_luajit https://github.com/JustyyDev/linc_luajit.git

      - name: Ensure HScript Version
        run: haxelib set hscript 2.4.0

      - name: Haxe Type Check
        run: haxelib run lime build windows -debug -DNO_PRELOAD_ALL -Dmessage.reporting=pretty -Dno-compilation
