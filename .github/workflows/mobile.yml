name: Mobile Builds (Android & iOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build-Tools
        run: |
          sdkmanager --install "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Setup Haxelib (Global)
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.3 --quiet --always
          haxelib install openfl 9.3.3 --quiet --always
          haxelib install flixel 5.6.2 --quiet --always
          haxelib install flixel-addons 3.2.3 --quiet --always
          haxelib install flixel-ui 2.6.1 --quiet --always
          haxelib install hscript 2.4.0 --quiet --always
          haxelib set hscript 2.4.0
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Configure Android Lime SDK Paths
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk/25.2.9519653
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Build Android Release APK
        run: haxelib run lime build android -release -DNO_PRELOAD_ALL
        env:
          HXCPP_COMPILE_THREADS: 4

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulScorch-Android-Release-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Xcode Project
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Setup Haxelib (macOS)
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.3 --quiet --always
          haxelib install openfl 9.3.3 --quiet --always
          haxelib install flixel 5.6.2 --quiet --always
          haxelib install flixel-addons 3.2.3 --quiet --always
          haxelib install flixel-ui 2.6.1 --quiet --always
          haxelib install hscript 2.4.0 --quiet --always
          haxelib set hscript 2.4.0
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Generate iOS C++ & Xcode Project
        run: haxelib run lime build ios -release -nosign -DNO_PRELOAD_ALL
        env:
          HXCPP_COMPILE_THREADS: 8

      - name: Package Xcode Build Output
        run: |
          cd export/release/ios
          zip -r ../../../SoulScorch-iOS-XcodeProject.zip .

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulScorch-iOS-XcodeProject
          path: SoulScorch-iOS-XcodeProject.zip
          if-no-files-found: error