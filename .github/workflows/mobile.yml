name: Mobile Builds (Android & iOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SOULSCORCH_EXTRA_DEFS: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;21.4.7075529" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"

      - name: Export Android NDK Environment Variables
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
          cache-dependency-path: project.xml

      - name: Cache hxcpp Compiler Data
        uses: actions/cache@v4
        with:
          path: ~/.cache/hxcpp
          key: ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-android-${{ hashFiles('project.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-android-

      - name: Install Haxelib Dependencies
        run: |
          haxelib install lime 8.1.3 --quiet --always --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --always --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --always --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --always --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --always --skip-dependencies
          haxelib install hscript 2.4.0 --quiet --always
          haxelib set hscript 2.4.0
          haxelib install hscript-iris 1.1.0 --quiet --always
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always

      - name: Patch Lime GPU Hint Export Syntax
        run: |
          python3 -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "lime"], capture_output=True, text=True)
          lines = [line.strip() for line in res.stdout.splitlines() if line.strip()]
          lime_path = lines[-1] if lines else ""
          system_hx = os.path.join(lime_path, "lime", "system", "System.hx")
          if not lime_path or not os.path.exists(system_hx):
              raise SystemExit(f"Could not find Lime System.hx at: {system_hx}")
          with open(system_hx, "r", encoding="utf-8") as f:
              content = f.read()
          patched = content.replace("_declspec(dllexport)", "__declspec(dllexport)")
          if patched != content:
              with open(system_hx, "w", encoding="utf-8") as f:
                  f.write(patched)
              print("Patched Lime System.hx:", system_hx)
          else:
              print("No Lime export patch needed:", system_hx)
          '

      - name: Patch Flixel ConsoleUtil for Haxe 4.3+
        run: |
          python3 -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "flixel"], capture_output=True, text=True)
          flixel_path = res.stdout.strip().splitlines()[-1]
          console_util = os.path.join(flixel_path, "flixel", "system", "debug", "console", "ConsoleUtil.hx")
          if os.path.exists(console_util):
              with open(console_util, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("return interp.expr(", "return @:privateAccess interp.expr(")
              with open(console_util, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched ConsoleUtil:", console_util)
          '

      - name: Configure Android Lime SDK Paths
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk/21.4.7075529
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Build Android Release APK
        run: haxelib run lime build android -release -DNO_PRELOAD_ALL -DHXCPP_NO_PCH -DHXCPP_STRIP_SYMBOLS -DHXCPP_GC_GENERATIONAL -DHXCPP_GC_BIG_BLOCKS ${{ env.SOULSCORCH_EXTRA_DEFS }}
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_ROOT: ${{ env.NDK_ROOT }}
          HXCPP_COMPILE_THREADS: 4

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulScorch-Android-Release-APK
          path: |
            bin/android/**/*.apk
            export/android/**/*.apk
            export/release/android/**/*.apk
            export/**/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Xcode Project
    runs-on: macos-14
    timeout-minutes: 60

    env:
      SOULSCORCH_EXTRA_DEFS: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
          cache-dependency-path: project.xml

      - name: Cache hxcpp Compiler Data
        uses: actions/cache@v4
        with:
          path: ~/.cache/hxcpp
          key: ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-ios-${{ hashFiles('project.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hxcpp-4.3.2-ios-

      - name: Install Haxelib Dependencies
        run: |
          haxelib install lime 8.1.3 --quiet --always --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --always --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --always --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --always --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --always --skip-dependencies
          haxelib install hscript 2.4.0 --quiet --always
          haxelib set hscript 2.4.0
          haxelib install hscript-iris 1.1.0 --quiet --always
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always

      - name: Patch Lime GPU Hint Export Syntax
        run: |
          python3 -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "lime"], capture_output=True, text=True)
          lines = [line.strip() for line in res.stdout.splitlines() if line.strip()]
          lime_path = lines[-1] if lines else ""
          system_hx = os.path.join(lime_path, "lime", "system", "System.hx")
          if not lime_path or not os.path.exists(system_hx):
              raise SystemExit(f"Could not find Lime System.hx at: {system_hx}")
          with open(system_hx, "r", encoding="utf-8") as f:
              content = f.read()
          patched = content.replace("_declspec(dllexport)", "__declspec(dllexport)")
          if patched != content:
              with open(system_hx, "w", encoding="utf-8") as f:
                  f.write(patched)
              print("Patched Lime System.hx:", system_hx)
          else:
              print("No Lime export patch needed:", system_hx)
          '

      - name: Rebuild Host Lime NDLL (macOS arm64 Fix)
        run: |
          haxelib run lime rebuild mac -release

          LIME_PATH="$(haxelib libpath lime)"
          if [ "$(uname -m)" = "arm64" ]; then
            LIME_NDLL_PATH="$LIME_PATH/ndll/MacArm64"
          else
            LIME_NDLL_PATH="$LIME_PATH/ndll/Mac64"
          fi

          test -f "$LIME_NDLL_PATH/lime.ndll"
          export NEKOPATH="$LIME_NDLL_PATH:$NEKOPATH"
          export DYLD_FALLBACK_LIBRARY_PATH="$LIME_NDLL_PATH:$DYLD_FALLBACK_LIBRARY_PATH"
          echo "NEKOPATH=$NEKOPATH" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$DYLD_FALLBACK_LIBRARY_PATH" >> "$GITHUB_ENV"
          haxelib run lime config MAC_USE_CURRENT_SDK 1

      - name: Patch Flixel ConsoleUtil for Haxe 4.3+
        run: |
          python3 -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "flixel"], capture_output=True, text=True)
          flixel_path = res.stdout.strip().splitlines()[-1]
          console_util = os.path.join(flixel_path, "flixel", "system", "debug", "console", "ConsoleUtil.hx")
          if os.path.exists(console_util):
              with open(console_util, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("return interp.expr(", "return @:privateAccess interp.expr(")
              with open(console_util, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched ConsoleUtil:", console_util)
          '

      - name: Generate iOS C++ & Xcode Project
        run: haxelib run lime build ios -release -nosign -DNO_PRELOAD_ALL -DHXCPP_NO_PCH -DHXCPP_STRIP_SYMBOLS -DHXCPP_GC_GENERATIONAL -DHXCPP_GC_BIG_BLOCKS ${{ env.SOULSCORCH_EXTRA_DEFS }}
        env:
          HXCPP_COMPILE_THREADS: 8

      - name: Package Xcode Build Output
        run: |
          python3 -c '
          import os, sys, zipfile

          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          output_zip = os.path.join(workspace, "SoulScorch-iOS-XcodeProject.zip")

          found_dir = None
          for search_root in ("export", "bin"):
            if not os.path.isdir(search_root):
              continue
            for root, dirs, files in os.walk(search_root):
              if "obj" in root or "haxe" in root or "ios" not in root.lower():
                continue
              if any(d.endswith(".xcodeproj") for d in dirs):
                found_dir = root
                break
            if found_dir:
              break

          if not found_dir:
              print("Error: Could not locate Xcode project directory.")
              sys.exit(1)

          print(f"Packaging iOS build from: {found_dir} -> {output_zip}")
          with zipfile.ZipFile(output_zip, "w", zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk(found_dir):
                  for file in files:
                      file_path = os.path.join(root, file)
                      arcname = os.path.relpath(file_path, found_dir)
                      zipf.write(file_path, arcname)

          print("Successfully created archive:", output_zip)
          '

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulScorch-iOS-XcodeProject
          path: SoulScorch-iOS-XcodeProject.zip
          if-no-files-found: error