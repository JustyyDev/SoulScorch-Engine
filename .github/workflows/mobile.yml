name: Mobile Builds (Android & iOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Cache Haxelibs
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            ~/.cache/hxcpp
          key: ${{ runner.os }}-haxelib-android-${{ hashFiles('**/Project.xml', '**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-android-

      - name: Install Haxelib Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.3 --quiet --always --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --always --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --always --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --always --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --always --skip-dependencies
          haxelib install hscript 2.4.0 --quiet --always
          haxelib set hscript 2.4.0
          haxelib install away3d --quiet --always
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --always
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Patch Flixel ConsoleUtil for Haxe 4.3+
        run: |
          python3 -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "flixel"], capture_output=True, text=True)
          flixel_path = res.stdout.strip().splitlines()[-1]
          console_util = os.path.join(flixel_path, "flixel", "system", "debug", "console", "ConsoleUtil.hx")
          with open(console_util, "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("return interp.expr(", "return @:privateAccess interp.expr(")
          with open(console_util, "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Configure Android Lime SDK Paths
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk/25.2.9519653
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Build Android Release APK
        run: haxelib run lime build android -release -DNO_PRELOAD_ALL -D HXCPP_NO_PCH
        env:
          HXCPP_COMPILE_THREADS: 4
          HXCPP_SILENT: 1

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulScorch-Android-Release-APK
          path: bin/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Xcode Project
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Cache Haxelibs
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            ~/.cache/hxcpp
          key: ${{ runner.os }}-haxelib-ios-${{ hashFiles('**/Project.xml', '**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-ios-

      - name: Install Haxelib Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.3 --quiet --always --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --always --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --always --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --always --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --always --skip-dependencies
          haxelib install hscript 2.4.0 --quiet --always
          haxelib set hscript 2.4.0
          haxelib install away3d --quiet --always
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --always
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Patch Flixel ConsoleUtil for Haxe 4.3+
        run: |
          python3 -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "flixel"], capture_output=True, text=True)
          flixel_path = res.stdout.strip().splitlines()[-1]
          console_util = os.path.join(flixel_path, "flixel", "system", "debug", "console", "ConsoleUtil.hx")
          with open(console_util, "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("return interp.expr(", "return @:privateAccess interp.expr(")
          with open(console_util, "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Generate iOS C++ & Xcode Project
        run: haxelib run lime build ios -release -nosign -DNO_PRELOAD_ALL -D HXCPP_NO_PCH
        env:
          HXCPP_COMPILE_THREADS: 8
          HXCPP_SILENT: 1

      - name: Package Xcode Build Output
        run: |
          find bin -type d -name "ios" -o -name "bin" | head -n 1
          # Locate and archive export folder safely
          TARGET_DIR=$(find bin -type d -name "ios" | head -n 1)
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            zip -qry ../../../SoulScorch-iOS-XcodeProject.zip .
          else
            echo "Searching export/ directory..."
            cd export/release/ios || cd export/ios || exit 1
            zip -qry ../../../SoulScorch-iOS-XcodeProject.zip .
          fi

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulScorch-iOS-XcodeProject
          path: SoulScorch-iOS-XcodeProject.zip
          if-no-files-found: error