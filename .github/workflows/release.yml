name: Release Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_name: SoulScorch-Windows
            output_dir: export/release/windows/bin
            archive_name: SoulScorch-Windows.zip
          - os: ubuntu-latest
            target: linux
            artifact_name: SoulScorch-Linux
            output_dir: export/release/linux/bin
            archive_name: SoulScorch-Linux.zip
          - os: macos-14
            target: mac
            artifact_name: SoulScorch-macOS
            output_dir: export/release/macos/bin
            archive_name: SoulScorch-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Install Native Linux Libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib g++-multilib \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Cache Haxelibs (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            C:/haxelib
            C:/Users/runneradmin/.hxcpp
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/Project.xml', '**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      - name: Cache Haxelibs (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            ~/.cache/hxcpp
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/Project.xml', '**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      - name: Install Haxelib Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          haxelib setup C:/haxelib
          haxelib install lime 8.1.3 --quiet --always --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --always --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --always --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --always --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --always --skip-dependencies
          haxelib install hscript 2.3.0 --quiet --always
          haxelib set hscript 2.3.0
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Install Haxelib Dependencies (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.3 --quiet --always --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --always --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --always --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --always --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --always --skip-dependencies
          haxelib install hscript 2.3.0 --quiet --always
          haxelib set hscript 2.3.0
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Compile SoulScorch Engine
        run: haxelib run lime build ${{ matrix.target }} -release -D HXCPP_NO_PCH
        env:
          HXCPP_COMPILE_THREADS: 8
          HXCPP_SILENT: 1

      - name: Package Executable Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.output_dir }}/*" -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Package Executable Archive (Unix / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd ${{ matrix.output_dir }}
          chmod +x * || true
          zip -qry ../../../../${{ matrix.archive_name }} .

      - name: Upload Packaged Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error