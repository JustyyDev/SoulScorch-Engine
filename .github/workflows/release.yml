name: Release Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_name: SoulScorch-Windows
            archive_name: SoulScorch-Windows.zip
          - os: ubuntu-latest
            target: linux
            artifact_name: SoulScorch-Linux
            archive_name: SoulScorch-Linux.zip
          - os: macos-14
            target: mac
            artifact_name: SoulScorch-macOS
            archive_name: SoulScorch-macOS.zip

    runs-on: ${{ matrix.os }}

    env:
      # Extra haxedefs injected into desktop builds. Empty by default.
      # Set to "-DSOULSCORCH_FMOD" (and provide the FMOD low-level SDK on the
      # runner) to build with the optional FMOD audio backend enabled.
      SOULSCORCH_EXTRA_DEFS: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Install Native Linux Libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib g++-multilib \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Cache Haxelibs (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            C:/haxelib
            C:/Users/runneradmin/.hxcpp
          key: ${{ runner.os }}-${{ runner.arch }}-haxe-4.3.6-haxelib-${{ hashFiles('project.xml', '**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-haxe-4.3.6-haxelib-

      - name: Cache Haxelibs (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            ~/.cache/hxcpp
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/project.xml', '**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      - name: Install Haxelib Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          haxelib setup C:/haxelib
          haxelib install lime 8.1.3 --quiet --always --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --always --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --always --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --always --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --always --skip-dependencies
          haxelib install hscript 2.4.0 --quiet --always
          haxelib set hscript 2.4.0
          haxelib install hscript-iris --quiet --always
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc --always
          haxelib git linc_luajit https://github.com/JustyyDev/linc_luajit.git --always
          # Install linc_fmod only when FMOD is enabled on the runner (PowerShell-compatible)
          if ( ($env:FMOD_SDK -ne $null -and $env:FMOD_SDK -ne '') -or ($env:ENABLE_FMOD -eq '1') ) {
            Write-Host 'FMOD enabled on runner; installing linc_fmod'
            haxelib install linc_fmod --quiet --always
          } else {
            Write-Host 'Skipping linc_fmod (FMOD disabled)'
          }
          haxelib install nape --quiet --always
          haxelib install seedyrng --quiet --always
          haxelib install hxbit --quiet --always
          haxelib install haxe-strings --quiet --always
          haxelib install actuate --quiet --always
          haxelib install thx.core --quiet --always
          haxelib install hxhttp --quiet --always
          haxelib install systools --quiet --always
          haxelib install markdown --quiet --always
          haxelib install heaps --quiet --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Install Haxelib Dependencies (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.3 --quiet --always --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --always --skip-dependencies
          haxelib install flixel 5.6.2 --quiet --always --skip-dependencies
          haxelib install flixel-addons 3.2.3 --quiet --always --skip-dependencies
          haxelib install flixel-ui 2.6.1 --quiet --always --skip-dependencies
          haxelib install hscript 2.4.0 --quiet --always
          haxelib set hscript 2.4.0
          haxelib install hscript-iris --quiet --always
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc --always
          haxelib git linc_luajit https://github.com/JustyyDev/linc_luajit.git --always
          # Install linc_fmod only when FMOD is enabled on the runner
          if [ -n "$FMOD_SDK" ] || [ "$ENABLE_FMOD" = "1" ]; then
            haxelib install linc_fmod --quiet --always
          else
            echo "Skipping linc_fmod (FMOD disabled)"
          fi
          haxelib install nape --quiet --always
          haxelib install seedyrng --quiet --always
          haxelib install hxbit --quiet --always
          haxelib install haxe-strings --quiet --always
          haxelib install actuate --quiet --always
          haxelib install thx.core --quiet --always
          haxelib install hxhttp --quiet --always
          haxelib install systools --quiet --always
          haxelib install markdown --quiet --always
          haxelib install heaps --quiet --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Rebuild Host Lime NDLL (macOS Fix)
        if: matrix.os == 'macos-14'
        run: |
          # Ensure neko is available for lime native modules
          if ! command -v neko >/dev/null 2>&1; then
            brew update || true
            brew install neko || true
          fi
          haxelib setup ~/haxelib
          haxelib run lime setup -y
          haxelib run lime rebuild mac -release

      - name: Patch Flixel ConsoleUtil for Haxe 4.3+
        run: |
          python3 -c '
          import subprocess, os
          res = subprocess.run(["haxelib", "libpath", "flixel"], capture_output=True, text=True)
          flixel_path = res.stdout.strip().splitlines()[-1]
          console_util = os.path.join(flixel_path, "flixel", "system", "debug", "console", "ConsoleUtil.hx")
          if os.path.exists(console_util):
              with open(console_util, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("return interp.expr(", "return @:privateAccess interp.expr(")
              with open(console_util, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched:", console_util)
          '

      - name: Compile SoulScorch Engine
        # -DSOULSCORCH_LUAJIT enables the native Lua scripting backend (matches project.xml).
        # SOULSCORCH_EXTRA_DEFS is empty by default; set it to -DSOULSCORCH_FMOD to opt into FMOD.
        run: haxelib run lime build ${{ matrix.target }} -release -DHXCPP_NO_PCH -DSOULSCORCH_LUAJIT ${{ env.SOULSCORCH_EXTRA_DEFS }}
        env:
          HXCPP_COMPILE_THREADS: 8

      - name: Package Executable Archive (Universal Python Packager)
        run: |
          python3 -c '
          import os, sys, zipfile

          target = "${{ matrix.target }}".lower()
          archive_name = "${{ matrix.archive_name }}"
          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          output_zip = os.path.join(workspace, archive_name)

          search_roots = ["bin", "export"]
          found_dir = None

          candidates = []
          for s_root in search_roots:
              if not os.path.exists(s_root):
                  continue
              for root, dirs, files in os.walk(s_root):
                  if "obj" in root or "haxe" in root:
                      continue
                  if target == "windows" and any(f.endswith(".exe") for f in files):
                      candidates.append(root)
                  elif target == "mac" and (any(d.endswith(".app") for d in dirs) or any(f.endswith(".app") for f in files) or "mac" in root.lower()):
                      candidates.append(root)
                  elif target == "linux" and ("linux" in root.lower() or any(os.access(os.path.join(root, f), os.X_OK) for f in files)):
                      candidates.append(root)

          for c in candidates:
              if target in c.lower() or (target == "mac" and "macos" in c.lower()):
                  found_dir = c
                  break

          if not found_dir and candidates:
              found_dir = candidates[0]

          if not found_dir:
              for s_root in search_roots:
                  if not os.path.exists(s_root): continue
                  for root, dirs, files in os.walk(s_root):
                      if os.path.basename(root) == "bin" and "obj" not in root and "haxe" not in root:
                          found_dir = root
                          break

          if not found_dir:
              print("Error: Could not locate build directory. Workspace contents:")
              for r, d, f in os.walk("."):
                  if not r.startswith("./.git"):
                      print(r, d, f)
              sys.exit(1)

          print(f"Packaging build from: {found_dir} -> {output_zip}")
          with zipfile.ZipFile(output_zip, "w", zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk(found_dir):
                  for file in files:
                      file_path = os.path.join(root, file)
                      arcname = os.path.relpath(file_path, found_dir)
                      zipf.write(file_path, arcname)

          print(f"Archive successfully created: {output_zip} ({os.path.getsize(output_zip)} bytes)")
          '

      - name: Upload Packaged Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error