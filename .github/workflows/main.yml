name: Build Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v3
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies
        run: |
          haxelib setup C:/haxelib
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.5.0
          haxelib run lime setup -y

      - name: Build
        run: |
          haxelib run lime build ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'ubuntu-latest' && 'linux' || 'mac' }} -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulScorch-${{ matrix.os }}
          path: export/release/