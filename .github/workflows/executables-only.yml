name: Release Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_name: SoulScorch-Windows-Binaries
            output_path: export/release/windows/bin
          - os: ubuntu-latest
            target: linux
            artifact_name: SoulScorch-Linux-Binaries
            output_path: export/release/linux/bin
          - os: macos-14
            target: mac
            artifact_name: SoulScorch-Mac-Binaries
            output_path: export/release/macos/bin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Install Native Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libgl1-mesa-dev libglu1-mesa-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libasound2-dev libpulse-dev

      - name: Setup Haxelib (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          haxelib setup C:/haxelib
          haxelib install lime 8.1.3 --quiet --always
          haxelib install openfl 9.3.3 --quiet --always
          haxelib install flixel 5.6.2 --quiet --always
          haxelib install flixel-addons 3.2.3 --quiet --always
          haxelib install flixel-ui 2.6.1 --quiet --always
          haxelib install hscript --quiet --always
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always
          haxelib git hxdiscord_rpc https://github.com/CodenameCrew/cne-hxdiscord_rpc.git --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Setup Haxelib (Unix / Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.3 --quiet --always
          haxelib install openfl 9.3.3 --quiet --always
          haxelib install flixel 5.6.2 --quiet --always
          haxelib install flixel-addons 3.2.3 --quiet --always
          haxelib install flixel-ui 2.6.1 --quiet --always
          haxelib install hscript --quiet --always
          haxelib install away3d --quiet --always
          haxelib install hxcpp 4.3.2 --quiet --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y

      - name: Build Engine (macOS Universal / ARM64)
        if: matrix.target == 'mac'
        run: haxelib run lime build mac -release
        env:
          HXCPP_COMPILE_THREADS: 8

      - name: Build Engine (Standard Targets)
        if: matrix.target != 'mac'
        run: haxelib run lime build ${{ matrix.target }} -release
        env:
          HXCPP_COMPILE_THREADS: 8

      - name: Upload Raw Executable Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}
          if-no-files-found: error